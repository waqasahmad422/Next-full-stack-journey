<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <center><h1>Form and Input Field</h1></center>
    <form action="#" method="get">
        <fieldset>
            <legend>Login Form</legend>
            <label for="email">Email</label>
            <input type="email" name="email" id="email" placeholder="example@gmail.com" required>
            <br><br>
            <label for="password">Password</label>
            <input type="password" name="password" id="password" placeholder="Enter your Password" required>
            <br><br>
            <input type="checkbox" name="remember" id="remember">
            <label for="remember">Remember Me</label>
            <br><br>    
            <button type="submit">Login</button>
        </fieldset>

    </form>

    <form action="#" enctype="multipart/form-data">
        <fieldset>
            <legend>Student Registration</legend>
            <label for="name" >Student Name</label>
            <input type="text" name="name" id="name" placeholder="Enter your name" pattern="[A-Za-z0-9]{4,12}" title="letters and digits, 4-12 char">
            <br><br>
            <label for="email">Email</label>
            <input type="email" name="email" id="email" placeholder="example@gmail.com">
            <br><br>
            <label for="phone">Phone</label>
            <input type="tel" name="phone" id="phone" placeholder="03206677890" maxlength="11" pattern="[0-9]{4}[0-9]{7}">
            <br><br>
            <label for="dob">Date of Birth</label>
            <input type="date" name="dob" id="dob" >
            <br><br>
            <label for="gender">Gender</label>
            <input type="radio" name="gender" value="Male" id="male">Male
            <input type="radio" name="gender" value="Female" id="female"> Female
            <br><br>
            <label for="courses">Courses</label>
            <select name="courses" id="courses">
                <option value="HTML">HTML</option>
                <option value="CSS">CSS</option>
                <option value="JS">JS</option>
                <option value="PHP">PHP</option>
            </select>
            <br><br>
            <label for="file">Upload file</label>
            <input type="file" name="file" id="file" accept="image/*", multiple>
            <br><br>
            <button type="submit">Register</button>
        </fieldset>
    </form>
</body>
</html>
