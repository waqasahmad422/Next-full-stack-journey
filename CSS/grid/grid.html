<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Layout</title>
    <style>
      *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .container{
        width: 100%;
        height: 100vh;
        background-color: rgb(240, 225, 22);
        display: grid;
        /* grid-template-rows: 60px 60px 60px 60px 60px;
        grid-template-columns: 100px 100px 100px; */
        
        grid-template-rows: repeat(12, 1fr);
        grid-template-columns: repeat(12, 1fr);

      }
      .box{
        /* width: 100px;
        height: 50px; */
        background-color: lightblue;
        border: 1px solid black;
        
      }
      .nav{
        /* grid-column-start: 1;
        grid-column-end: 3; */
        grid-column:1/13;
        /* grid-column: 1/ span 3; */
         /* (span mean how much column used after the line 1 selected) */
         background-color: blue;
      }
      .side{
        grid-row: 2/12;
        grid-column: 1/3;
        background-color: aqua;
      }
      .content{
        grid-row: 2/12;
        grid-column: 3/13;
      }
      .footer{
        grid-column: 1/13;
        background-color: brown;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box nav">1</div>
      <div class="box side">2</div>
      <div class="box content">3</div>
      <div class="box footer">5</div>
    </div>
  </body>
</html>
