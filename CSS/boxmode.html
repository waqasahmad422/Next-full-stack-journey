<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        .box, .padd, .content{
            text-align: center;
            color:wheat
        }
        .box{
            width: 300px;
            height: 300px;
            background-color: rgb(78, 5, 5);
            margin: 50px auto;
            padding: 20px;
        }
        .border{
            width:80%;
            height:80%;
            background-color: rgb(255, 255, 255);
            color: rgb(161, 11, 11);
            margin: 25px;
            border: 7px solid rgb(161, 11, 11);
        }
       .border > .padd{
            width: 60%;
            height: 60%;
            background-color: rgb(19, 165, 19);
            padding: 20px;
            margin: 25px;
        }
       .content{
            width: 100%;
            height: 90%;
            background-color: rgb(31, 4, 104);
            color: rgb(255, 255, 255);
            text-align: center;
            line-height: 100px;
            font-size: 20px;
        }
        .title{
            text-align: center;
            color: rgb(161, 11, 11);
        }
    </style>
</head>
<body>
    <h1 class="title">Box Model</h1>
    <div class="box">
        margin
        <div class="border">
            Border
            <div class="padd">
                Padding
                <div class="content">
                    content
                </div>
            </div>
        </div>
    </div>
</body>
</html>
