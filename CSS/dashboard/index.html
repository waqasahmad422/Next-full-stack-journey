<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="dashboard">
        <section class="sidebar">
            <h2 class="sidebar-title">Meridian</h2>
            <ul class="sidebar-items">
                <li class="iteam"><a href="" class="item-link">Overview</a></li>
                <li class="iteam"><a href="" class="item-link">customers</a></li>
                <li class="iteam"><a href="" class="item-link">orders</a></li>
                <li class="iteam"><a href="" class="item-link">Reports</a></li>
                <li class="iteam"><a href="" class="item-link">settings</a></li>
            </ul>
        </section>
        <section class="main-content">
            <header class="header">
                <div class="title-side">
                    <h1 class="title">Overview</h1>
                    <span class="s-text">Sample date - last 30 days</span>
                </div>
                <form action="#" class="search-section">
                    <input type="search" name="search" id="search" class="search" placeholder="Search">
                    <button type="submit" class="btn">New Report</button>
                </form>
            </header>
            <section class="cards">
                <div class="card-item">
                    <h5 class="card-title">Revenue</h5>
                    <h2 class="card-price">$48,200</h2>
                    <span class="per">+12.4%</span>
                </div>
                <div class="card-item">
                    <h5 class="card-title">Orders</h5>
                    <h2 class="card-price">1,284</h2>
                    <span class="per">+4.1%</span>
                </div>
                <div class="card-item">
                    <h4 class="card-title">New Customers</h4>
                    <h2 class="card-price">312</h2>
                    <span class="per">+8.7%</span>
                </div>
                <div class="card-item">
                    <h4 class="card-title">Refund rate</h4>
                    <h2 class="card-price">1.9%</h2>
                    <span class="per">+0.3%</span>
                </div>
            </section>
            <section class="container">
                <div class="image">
                    <img src="../media-query/cat.jpg" alt="">
                </div>
                <div class="image">
                    <img src="../media-query/dog.jpg" alt="">
                </div>
            </section>
        </section>
    </main>
</body>
</html>
