<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            width:100%;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background-color:#968f8f;
        }
        .card{
            width: 300px;
            height: 300px;
            background-color:#ffffff;
        }
        .smily-face{
            width:200px;
            height:200px;
            background-color:#f1c40f;
            border-radius:50%;
            position:relative;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
        }
        .eye-left{
            width:23px;
            height:23px;
            background-color:#000000;
            border-radius:50%;
            position:absolute;
            top:50px;
            left:50px;
        }
        .eye-right{
            width: 23px;
            height:23px;
            background-color:#000000;
            border-radius:50%;
            position:absolute;
            top:50px;
            right:50px;
        }
        .mouth{
            width:100px;
            height:40px;
            background-color:#530a0a;
            position:absolute;
            bottom:40px;
            left:50%;
            transform:translateX(-50%);
            border-radius:0 0 25px 25px;
        }
    </style>
  </head>
  <body>
    <section class="card">
      <article class="smily-face">
        <div class="eye-left"></div>
        <div class="eye-right"></div>
        <div class="mouth"></div>
      </article>
    </section>
  </body>
</html>
